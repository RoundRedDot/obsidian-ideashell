<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="Obsidian to ideashell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ff"/>
      <stop offset="1" stop-color="#fff3ee"/>
    </linearGradient>
    <linearGradient id="obs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a88bfa"/>
      <stop offset="1" stop-color="#6c4fd6"/>
    </linearGradient>
    <mask id="ring-notch">
      <rect width="760" height="220" fill="#fff"/>
      <circle cx="628" cy="66" r="34" fill="#000"/>
    </mask>
  </defs>

  <rect width="760" height="220" rx="24" fill="url(#bg)"/>

  <!-- Obsidian: purple gem -->
  <g transform="translate(140 110)">
    <polygon points="0,-64 46,-30 30,52 -30,52 -46,-30" fill="url(#obs)"/>
    <polygon points="0,-64 46,-30 0,10" fill="#c5b3ff" opacity=".8"/>
    <polygon points="-46,-30 0,10 -30,52" fill="#5a3fc4" opacity=".7"/>
    <polygon points="0,10 30,52 -30,52" fill="#7b62e0" opacity=".9"/>
  </g>
  <text x="140" y="196" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4b3f8f">Obsidian</text>

  <!-- notes flowing -->
  <g fill="none" stroke="#c9c2e8" stroke-width="2" stroke-linecap="round">
    <rect x="262" y="78" width="40" height="52" rx="6" fill="#fff"/>
    <line x1="272" y1="92" x2="292" y2="92"/><line x1="272" y1="104" x2="292" y2="104"/><line x1="272" y1="116" x2="284" y2="116"/>
    <rect x="316" y="66" width="40" height="52" rx="6" fill="#fff" stroke="#e4b9a9"/>
    <line x1="326" y1="80" x2="346" y2="80" stroke="#e4b9a9"/><line x1="326" y1="92" x2="346" y2="92" stroke="#e4b9a9"/><line x1="326" y1="104" x2="338" y2="104" stroke="#e4b9a9"/>
  </g>
  <!-- arrow -->
  <path d="M380 110 H470" stroke="#ff4a1f" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M452 92 L478 110 L452 128 Z" fill="#ff4a1f"/>

  <!-- ideashell: orange ring with a bite and sparkles -->
  <g mask="url(#ring-notch)">
    <circle cx="598" cy="110" r="66" fill="none" stroke="#ff4a1f" stroke-width="30"/>
  </g>
  <g fill="#ff4a1f">
    <path d="M648 44 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
    <path d="M628 32 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 z"/>
    <path d="M672 22 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
  </g>
  <text x="598" y="196" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c93a12">ideashell · 闪念贝壳</text>
</svg>
